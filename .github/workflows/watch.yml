name: Odyssey IMAX Watcher

on:
  schedule:
    # רשת ביטחון בלבד - הטריגר האמיתי הוא cron-job.org
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "ריצה ידנית"
        required: false
        default: "normal"
        type: choice
        options: [normal, discover, test-alert, reset]

permissions:
  contents: write

concurrency:
  group: odyssey-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          case "${{ github.event.inputs.mode }}" in
            discover)    python3 watch.py --discover ;;
            test-alert)  python3 watch.py --test-alert ;;
            reset)       python3 watch.py --reset ;;
            *)           python3 watch.py ;;
          esac

      # שמירת המצב. GitHub מחזיר לפעמים 500 על push בתדירות גבוהה,
      # ולכן: 5 נסיונות עם rebase והשהיה, ואם גם זה נכשל - לא מפילים
      # את הריצה (continue-on-error). הכשל היחיד שזה גורם הוא התראה
      # כפולה אפשרית, לא החמצה.
      - name: Persist state
        if: always()
        continue-on-error: true
        run: |
          git config user.name  "odyssey-watcher"
          git config user.email "actions@users.noreply.github.com"

          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "no state change"
            exit 0
          fi

          git add state.json
          git commit -m "state: $(date -u +%FT%TZ)"

          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            if git push origin main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push attempt $i failed, retrying..."
            sleep $((i * 4))
          done

          echo "::warning::could not persist state.json after 5 attempts (GitHub 500). Continuing."
