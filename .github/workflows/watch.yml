name: Odyssey IMAX Watcher

on:
  schedule:
    # כל 10 דקות (UTC). GitHub עשוי לאחר בכמה דקות בשעות עומס - זה נורמלי.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "ריצה ידנית"
        required: false
        default: "normal"
        type: choice
        options: [normal, discover, test-alert, reset]

permissions:
  contents: write

concurrency:
  group: odyssey-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          case "${{ github.event.inputs.mode }}" in
            discover)    python3 watch.py --discover ;;
            test-alert)  python3 watch.py --test-alert ;;
            reset)       python3 watch.py --reset ;;
            *)           python3 watch.py ;;
          esac

      - name: Persist state
        if: always()
        run: |
          git config user.name  "odyssey-watcher"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain state.json)" ]; then
            git add state.json
            git commit -m "state: $(date -u +%FT%TZ)"
            git pull --rebase --autostash || true
            git push
          else
            echo "no state change"
          fi
